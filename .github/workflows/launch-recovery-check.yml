name: Launch Recovery Check
on:
  push:
    branches: [baker-launch-recovery-20261005]
    paths: ['.github/workflows/launch-recovery-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public registrar controls and request resend only if available
        run: |
          mkdir -p /tmp/baker-domain-read /tmp/baker-domain-evidence
          npm install --prefix /tmp/baker-domain-read playwright --no-audit --no-fund
          /tmp/baker-domain-read/node_modules/.bin/playwright install chromium
          cd /tmp/baker-domain-read
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true});const page=await browser.newPage();
          const result={checkedAt:new Date().toISOString(),attemptedResend:false,challengePresent:false};
          const scrub=s=>String(s||'').replace(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/gi,'[email omitted]').slice(0,140);
          try{
            await page.goto('http://fieldworkbybaker.com/',{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(2000);
            result.title=await page.title();result.controls=[];
            let target;
            for(const frame of page.frames()){
              result.controls.push(...(await frame.locator('button,input[type=submit],input[type=button],a').evaluateAll(els=>els.map(e=>({tag:e.tagName,label:e.textContent||e.getAttribute('aria-label')||e.value||''}))).catch(()=>[])).filter(e=>/resend|verif|support/i.test(e.label)).map(e=>({tag:e.tag,label:scrub(e.label)})));
              if(await frame.locator('iframe[src*="captcha"],input[name*="captcha"],.g-recaptcha,.h-captcha').count())result.challengePresent=true;
              const choices=frame.getByRole('button',{name:/resend/i});
              if(await choices.count() && await choices.first().isVisible())target=choices.first();
            }
            if(target && !result.challengePresent){
              await target.click({timeout:10000});result.attemptedResend=true;await page.waitForTimeout(2000);
              const texts=await Promise.all(page.frames().map(f=>f.locator('body').innerText().catch(()=>'')));
              const text=texts.join(' ').toLowerCase();
              result.confirmed=/verification email (has been|was) (sent|resent)|email (has been|was) (sent|resent) successfully|verification email sent/.test(text);
              result.challengeAfterClick=/captcha|verify you are human|not a robot/.test(text);
            }else result.reason=result.challengePresent?'Public resend requires a human verification challenge; no automated bypass attempted.':'No visible public resend button. Namecheap account access is required.';
          }catch(e){result.error=e.name;}
          await fs.writeFile('/tmp/baker-domain-evidence/registrar-action.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registrar-action-evidence
          path: /tmp/baker-domain-evidence
          retention-days: 3

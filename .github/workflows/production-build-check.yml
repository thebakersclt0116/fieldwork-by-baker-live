name: Production Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Build production frontend
        run: npm run build
      - name: Bundle production API routes
        run: |
          mkdir -p /tmp/baker-api-check
          for route in api/*.ts; do
            case "$route" in
              api/_*) continue ;;
            esac
            name="$(basename "$route" .ts)"
            ./node_modules/.bin/esbuild "$route" --bundle --platform=node --format=esm --target=node22 --outfile="/tmp/baker-api-check/$name.mjs"
          done

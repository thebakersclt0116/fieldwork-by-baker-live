name: Smart Import Hardening Build

on:
  push:
    branches: [smart-import-hardening]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rm -f package-lock.json && npm install
      - run: npm run build

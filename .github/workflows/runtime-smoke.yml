name: Baker AI production smoke

on:
  push:
    branches:
      - baker-ai-beta
    paths:
      - .github/workflows/runtime-smoke.yml

# Runtime smoke after dynamic import diagnostic promotion.
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Baker AI runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://fieldwork-by-baker-testing.vercel.app"
          echo "Checking $BASE/api/health"
          HEALTH="$(curl --silent --show-error --retry 4 --retry-delay 2 "$BASE/api/health")"
          echo "$HEALTH" | jq .
          echo "Checking $BASE/api/baker-ai"
          AI="$(curl --silent --show-error --retry 4 --retry-delay 2 "$BASE/api/baker-ai")"
          echo "$AI" | jq . || true

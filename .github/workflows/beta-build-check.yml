name: Beta build check

on:
  push:
    branches:
      - baker-ai-beta
    paths:
      - .github/workflows/beta-build-check.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies with known-good registry path
        run: rm -f package-lock.json && npm install
      - name: Build application
        run: npm run build

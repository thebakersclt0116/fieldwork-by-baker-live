name: Production Launch Verification

on:
  push:
    branches: [launch-verification]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public production endpoints and auth gate
        run: |
          set -euo pipefail
          BASE='https://fieldwork-by-baker-testing.vercel.app'

          HEALTH="$(curl -fsS --connect-timeout 10 --max-time 30 "$BASE/api/health")"
          echo "$HEALTH" | grep -q '"aiGatewayAuthAvailable":true'
          echo "$HEALTH" | grep -q '"secureSessionSigningAvailable":true'
          echo "$HEALTH" | grep -q '"model":"openai/gpt-5.6-sol"'

          READY="$(curl -fsS --connect-timeout 10 --max-time 30 "$BASE/api/baker-ai")"
          echo "$READY" | grep -q '"status":"ready"'
          echo "$READY" | grep -q '"model":"openai/gpt-5.6-sol"'

          CODE="$(curl -sS -o /tmp/baker-ai-body -w '%{http_code}' --connect-timeout 10 --max-time 30 -X POST "$BASE/api/baker-ai" -H 'Content-Type: application/json' --data '{"text":"verification request","date":"2026-09-12"}')"
          test "$CODE" = '401'
          grep -q 'Baker session' /tmp/baker-ai-body

          echo 'Fieldwork by Baker launch endpoints are healthy and protected.'

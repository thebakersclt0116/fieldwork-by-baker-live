name: Public Outage Check
on:
  push:
    branches: [baker-public-outage-check-20261001]
    paths: ['.github/workflows/public-outage-check.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect public DNS and HTTP responses
        run: |
          mkdir -p /tmp/baker-public-evidence
          node --input-type=module <<'JS'
          import dns from 'node:dns/promises';
          import fs from 'node:fs/promises';
          const hosts = ['www.fieldworkbybaker.com','fieldworkbybaker.com','fieldwork-by-baker-testing.vercel.app'];
          const report = { checkedAt: new Date().toISOString(), dns: [], http: [] };
          for (const host of hosts) {
            for (const type of ['A','AAAA','CNAME']) {
              try { const records = await dns.resolve(host, type); report.dns.push({host,type,records}); }
              catch (e) { report.dns.push({host,type,error:e.code}); }
            }
          }
          const urls = hosts.map(h => 'https://' + h + '/').concat(['https://www.fieldworkbybaker.com/api/health','https://www.fieldworkbybaker.com/api/baker-ai','https://www.fieldworkbybaker.com/login','https://www.fieldworkbybaker.com/import']);
          await Promise.all(urls.map(async url => {
            const start = Date.now();
            try {
              const response = await fetch(url + '?public_incident_check=' + Date.now(), {signal:AbortSignal.timeout(25000),redirect:'follow'});
              const body = await response.text();
              const headers = Object.fromEntries(['server','content-type','x-vercel-error','x-vercel-id','x-vercel-cache','cache-control'].map(k => [k,response.headers.get(k)]));
              const sample = url.includes('/api/') || response.status >= 400 ? body.slice(0,2500) : (body.match(/<title[^>]*>(.*?)<\/title>/is)?.[1] || 'No title in HTML');
              report.http.push({url,status:response.status,finalUrl:response.url,elapsedMs:Date.now()-start,headers,sample});
            } catch(e) {report.http.push({url,error:e.message,code:e.cause?.code,elapsedMs:Date.now()-start});}
          }));
          await fs.writeFile('/tmp/baker-public-evidence/http.json', JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS
      - name: Install isolated browser diagnostics
        run: |
          mkdir -p /tmp/baker-public-browser
          npm install --prefix /tmp/baker-public-browser playwright --no-audit --no-fund
          /tmp/baker-public-browser/node_modules/.bin/playwright install chromium
      - name: Read public site as a signed-out browser
        run: |
          cd /tmp/baker-public-browser
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const browser = await chromium.launch({ headless:true });
          const report = [];
          for (const [name,url] of [['homepage','https://www.fieldworkbybaker.com/'],['login','https://www.fieldworkbybaker.com/login'],['vercel-domain','https://fieldwork-by-baker-testing.vercel.app/']]) {
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const errors = [], failures = [], badResponses = [];
            page.on('pageerror',error => errors.push(error.message.slice(0,1500)));
            page.on('requestfailed',request => failures.push({url:request.url().split('?')[0],error:request.failure()?.errorText}));
            page.on('response',response => {if(response.status() >= 400) badResponses.push({url:response.url().split('?')[0],status:response.status()});});
            try {
              const response = await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(3000);
              report.push({name,url,finalUrl:page.url(),status:response?.status(),title:await page.title(),visibleText:(await page.locator('body').innerText()).slice(0,4000),errors,failures,badResponses});
              await page.screenshot({path:'/tmp/baker-public-evidence/'+name+'.png',fullPage:false});
            } catch(e) {report.push({name,url,error:e.message,errors,failures,badResponses});}
            await page.close();
          }
          await browser.close();
          await fs.writeFile('/tmp/baker-public-evidence/browser.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-outage-evidence
          path: /tmp/baker-public-evidence
          retention-days: 3

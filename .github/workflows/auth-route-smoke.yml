name: Production Auth Route Smoke

on:
  push:
    branches: [domain-setup]
    paths:
      - '.github/workflows/auth-route-smoke.yml'

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify auth route is healthy
        run: |
          set -euo pipefail
          BASE='https://fieldwork-by-baker-testing.vercel.app'
          HEALTH="$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/api/health")"
          echo "$HEALTH" | grep -q '"secureSessionSigningAvailable":true'
          CODE="$(curl -sS -o /tmp/auth-body -w '%{http_code}' --connect-timeout 10 --max-time 20 \
            -X POST "$BASE/api/auth" \
            -H 'Content-Type: application/json' \
            --data '{"email":"ayalaemily52@gmail.com","password":"intentionally-wrong-smoke-test"}')"
          test "$CODE" = '401'
          grep -q 'Invalid email or password' /tmp/auth-body
          echo 'Auth route is live and credential validation is executing normally.'

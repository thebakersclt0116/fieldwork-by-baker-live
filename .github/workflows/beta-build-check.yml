name: Beta build check

on:
  push:
    branches:
      - baker-ai-beta
    paths:
      - .github/workflows/beta-build-check.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baker-ai-beta
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies with known-good registry path
        run: rm -f package-lock.json && npm install
      - name: Build application
        run: npm run build
      - name: Commit compiled frontend only
        run: |
          git config user.name "Fieldwork by Baker Build"
          git config user.email "build@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "Compiled frontend already current."
          else
            git commit -m "Build current beta frontend"
            git push origin HEAD:baker-ai-beta
          fi

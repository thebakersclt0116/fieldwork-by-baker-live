name: Production Auth Route Smoke

on:
  push:
    branches: [domain-setup]
    paths:
      - '.github/workflows/auth-route-smoke.yml'

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose auth route safely
        run: |
          set +e
          BASE='https://fieldwork-by-baker-testing.vercel.app'
          echo '=== HEALTH ==='
          curl -sS -i --connect-timeout 10 --max-time 20 "$BASE/api/health"
          echo
          echo '=== AUTH ROUTE CHECK ==='
          CODE="$(curl -sS -o /tmp/auth-body -w '%{http_code}' --connect-timeout 10 --max-time 20 \
            -X POST "$BASE/api/auth" \
            -H 'Content-Type: application/json' \
            --data '{"email":"nobody@example.invalid","password":"invalid-smoke-value"}')"
          echo "HTTP_STATUS=$CODE"
          cat /tmp/auth-body || true
          echo
          exit 0

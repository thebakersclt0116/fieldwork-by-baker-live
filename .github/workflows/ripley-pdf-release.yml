name: Ripley PDF Release
on:
  push:
    branches: [baker-ripley-detailed-pdf-20261006, main]
    paths: ['src/**', 'public/guides/**', 'scripts/*pdf*', 'package.json', '.github/workflows/ripley-pdf-release.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ripley-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install exactly as current Vercel project
        run: |
          npm ci --registry=https://registry.npmjs.org/
      - name: Resolve real PDF reader and matching worker
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url);
          for(const p of ['pdfjs-dist/legacy/build/pdf.mjs','pdfjs-dist/legacy/build/pdf.worker.min.mjs']) console.log('Resolved '+p+': '+Boolean(require.resolve(p)));
          console.log('Installed pdfjs-dist version: '+require('pdfjs-dist/package.json').version);
          JS
      - name: Existing data integrity regression tests
        run: node --experimental-strip-types --test scripts/detailed-migration.test.mjs scripts/source-fidelity.test.mjs scripts/import-integrity.test.mjs
      - name: Production regression checks
        run: node scripts/fieldwork-regression-check.mjs
      - name: Full TypeScript and Vite production build
        run: |
          rm -rf dist
          npm run build
      - name: Bundle API routes independently
        run: |
          mkdir -p /tmp/pdf-api-check
          for route in api/*.ts; do
            case "$route" in api/_*) continue ;; esac
            ./node_modules/.bin/esbuild "$route" --bundle --platform=node --format=esm --target=node22 --outfile="/tmp/pdf-api-check/$(basename "$route" .ts).mjs"
          done
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1 pdf-lib@1.17.1
          npx playwright install chromium
      - name: Actual PDF upload and browser-worker acceptance
        run: node scripts/ripley-pdf-browser-check.mjs
      - name: Wait for exact public-domain deployment
        if: github.ref == 'refs/heads/main'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let n=0;n<40;n++){
            try{const r=await fetch('https://www.fieldworkbybaker.com/api/health?pdf_release='+Date.now(),{signal:AbortSignal.timeout(10000)});const h=await r.json();if(r.ok && h.deployedCommit===process.env.EXPECTED_COMMIT){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ready)throw new Error('Expected production commit is not live on the custom domain.');
          console.log('Exact production commit confirmed.');
          JS
      - name: Real signed-user bulk PDF import on the live website
        if: github.ref == 'refs/heads/main'
        env:
          BAKER_TEST_ORIGIN: https://www.fieldworkbybaker.com
        run: node scripts/ripley-pdf-browser-check.mjs
      - name: Save dependency security report without forced upgrades
        if: always()
        run: |
          mkdir -p pdf-release-evidence
          npm audit --json > pdf-release-evidence/dependency-audit.json || true
      - name: Collect compiled app and non-secret PDF source for independent testing
        if: always()
        run: |
          mkdir -p pdf-release-evidence
          if test -f dist/index.html; then zip -qr pdf-release-evidence/compiled-frontend.zip dist; fi
          zip -q pdf-release-evidence/pdf-release-source.zip src/lib/ripleyPdfImport.ts src/lib/ripleyPdfLayout.ts src/lib/detailedMigration.ts src/pages/DetailedMigration.tsx src/components/RipleyPdfGuide.tsx package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripley-pdf-build-evidence
          path: pdf-release-evidence
          retention-days: 5

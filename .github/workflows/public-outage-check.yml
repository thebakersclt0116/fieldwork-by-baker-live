name: Public Outage Check
on:
  push:
    branches: [baker-public-outage-check-20261001]
    paths: ['.github/workflows/public-outage-check.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read authoritative DNS, registry and deployment health
        run: |
          mkdir -p /tmp/baker-public-evidence
          node --input-type=module <<'JS'
          import dns from 'node:dns/promises';
          import fs from 'node:fs/promises';
          const report = { checkedAt:new Date().toISOString(), dns:[], http:[], registry:null };
          await Promise.all(['NS','SOA','A','MX'].map(async type => {
            try { report.dns.push({type,records:await dns.resolve('fieldworkbybaker.com',type)}); }
            catch(e){report.dns.push({type,error:e.code});}
          }));
          const ns = report.dns.find(x=>x.type==='NS')?.records || [];
          for (const host of ns) {
            try {
              const ips = await dns.resolve4(host); const resolver = new dns.Resolver(); resolver.setServers(ips);
              report.dns.push({authoritativeServer:host,apex:await resolver.resolve4('fieldworkbybaker.com'),www:await resolver.resolve4('www.fieldworkbybaker.com')});
            } catch(e){report.dns.push({authoritativeServer:host,error:e.code});}
          }
          try {
            const response = await fetch('https://rdap.verisign.com/com/v1/domain/fieldworkbybaker.com',{signal:AbortSignal.timeout(15000)});
            const r = await response.json();
            report.registry = {status:r.status,events:r.events,nameservers:r.nameservers?.map(n=>n.ldhName),registrars:r.entities?.filter(e=>e.roles?.includes('registrar')).map(e=>({handle:e.handle,roles:e.roles}))};
          } catch(e){report.registry={error:e.message};}
          await Promise.all(['http://fieldworkbybaker.com/','http://www.fieldworkbybaker.com/','https://fieldwork-by-baker-testing.vercel.app/api/health','https://fieldwork-by-baker-testing.vercel.app/api/baker-ai'].map(async url=>{
            try {
              const r=await fetch(url,{signal:AbortSignal.timeout(15000)}),body=await r.text();
              const sample=url.includes('/api/')?body.slice(0,3500):body.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').slice(0,4000);
              report.http.push({url,status:r.status,finalUrl:r.url,server:r.headers.get('server'),sample});
            }catch(e){report.http.push({url,error:e.message,code:e.cause?.code});}
          }));
          await fs.writeFile('/tmp/baker-public-evidence/domain-status.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-domain-evidence
          path: /tmp/baker-public-evidence
          retention-days: 3

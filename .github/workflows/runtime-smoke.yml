name: Baker AI production smoke

on:
  push:
    branches:
      - baker-ai-beta
    paths:
      - .github/workflows/runtime-smoke.yml

# Re-run after operational OIDC/session-signing production deployment.
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Baker AI runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://fieldwork-by-baker-testing.vercel.app"
          echo "Checking $BASE/api/health"
          HEALTH="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE/api/health")"
          echo "$HEALTH" | jq .
          echo "$HEALTH" | jq -e '.bakerAI == "configured"'
          echo "$HEALTH" | jq -e '.aiGatewayAuthAvailable == true'
          echo "$HEALTH" | jq -e '.secureSessionSigningAvailable == true'
          echo "Checking $BASE/api/baker-ai"
          AI="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE/api/baker-ai")"
          echo "$AI" | jq .
          echo "$AI" | jq -e '.service == "Baker AI" and .status == "ready" and .gatewayAuthAvailable == true'

name: Ripley PDF Release
on:
  push:
    branches: [baker-ripley-detailed-pdf-20261006, main]
    paths: ['src/**', 'public/guides/**', 'api/**', 'server/**', 'cloud/**', 'shared/**', 'scripts/**', 'package.json', 'package-lock.json', 'tsconfig*.json', 'vercel.json', '.do/**', '.dockerignore', '.github/workflows/ripley-pdf-release.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'public/guides/**', 'api/**', 'server/**', 'cloud/**', 'shared/**', 'scripts/**', 'package.json', 'package-lock.json', 'tsconfig*.json', 'vercel.json', '.do/**', '.dockerignore', '.github/workflows/ripley-pdf-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ripley-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - name: Install the reviewed Vercel and cloud dependency lock
        run: npm ci --registry=https://registry.npmjs.org/
      - name: Resolve real PDF reader and matching worker
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          const require=createRequire(import.meta.url);
          for(const p of ['pdfjs-dist/legacy/build/pdf.mjs','pdfjs-dist/legacy/build/pdf.worker.min.mjs']) console.log('Resolved '+p+': '+Boolean(require.resolve(p)));
          console.log('Installed pdfjs-dist version: '+require('pdfjs-dist/package.json').version);
          JS
      - name: Existing data integrity regression tests
        run: node --experimental-strip-types --test scripts/detailed-migration.test.mjs scripts/source-fidelity.test.mjs scripts/import-integrity.test.mjs
      - name: Production regression checks
        run: node scripts/fieldwork-regression-check.mjs
      - name: Cloud account, storage, billing, and browser state integrity
        run: npm run test:cloud
      - name: Compile the DigitalOcean service
        run: npm run cloud:build
      - name: Full TypeScript and Vite production build
        run: |
          rm -rf dist
          npm run build
      - name: Bundle API routes independently
        run: |
          mkdir -p /tmp/pdf-api-check
          for route in api/*.ts; do
            case "$route" in api/_*) continue ;; esac
            ./node_modules/.bin/esbuild "$route" --bundle --platform=node --format=esm --target=node24 --outfile="/tmp/pdf-api-check/$(basename "$route" .ts).mjs"
          done
      - name: Install the browser for the locked acceptance test dependency
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Actual PDF upload and browser-worker acceptance
        run: node scripts/ripley-pdf-browser-check.mjs
      - name: Require an explicitly configured dedicated live QA account
        if: github.ref == 'refs/heads/main'
        env:
          BAKER_PDF_QA_DEDICATED: ${{ vars.BAKER_PDF_QA_DEDICATED }}
          BAKER_PDF_QA_EMAIL: ${{ secrets.BAKER_PDF_QA_EMAIL }}
          BAKER_PDF_QA_PASSWORD: ${{ secrets.BAKER_PDF_QA_PASSWORD }}
          BAKER_PDF_QA_WORKSPACE_ID: ${{ secrets.BAKER_PDF_QA_WORKSPACE_ID }}
        run: |
          node --input-type=module <<'JS'
          const required=['BAKER_PDF_QA_EMAIL','BAKER_PDF_QA_PASSWORD','BAKER_PDF_QA_WORKSPACE_ID'];
          if(process.env.BAKER_PDF_QA_DEDICATED!=='true'||required.some(key=>!process.env[key]?.trim())){
            throw new Error('Live PDF acceptance is blocked: configure the dedicated synthetic-only Fieldwork PDF QA account, encrypted QA credentials/workspace ID, and BAKER_PDF_QA_DEDICATED=true. No live signup or customer account may be used.');
          }
          console.log('Dedicated QA configuration is present; account and workspace will be verified by the live test.');
          JS
      - name: Wait for exact public-domain deployment
        if: github.ref == 'refs/heads/main'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let n=0;n<40;n++){
            try{const r=await fetch('https://www.fieldworkbybaker.com/api/health?pdf_release='+Date.now(),{signal:AbortSignal.timeout(10000)});const h=await r.json();if(r.ok && h.deployedCommit===process.env.EXPECTED_COMMIT){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!ready)throw new Error('Expected production commit is not live on the custom domain.');
          console.log('Exact production commit confirmed.');
          JS
      - name: Verified dedicated-QA bulk PDF import with cloud readback
        if: github.ref == 'refs/heads/main'
        env:
          BAKER_TEST_ORIGIN: https://www.fieldworkbybaker.com
          BAKER_PDF_QA_DEDICATED: ${{ vars.BAKER_PDF_QA_DEDICATED }}
          BAKER_PDF_QA_EMAIL: ${{ secrets.BAKER_PDF_QA_EMAIL }}
          BAKER_PDF_QA_PASSWORD: ${{ secrets.BAKER_PDF_QA_PASSWORD }}
          BAKER_PDF_QA_WORKSPACE_ID: ${{ secrets.BAKER_PDF_QA_WORKSPACE_ID }}
        run: node scripts/ripley-pdf-browser-check.mjs
      - name: Save dependency security report without forced upgrades
        if: always()
        run: |
          mkdir -p pdf-release-evidence
          npm audit --json > pdf-release-evidence/dependency-audit.json || true
      - name: Collect compiled app and non-secret PDF source for independent testing
        if: always()
        run: |
          mkdir -p pdf-release-evidence
          if test -f dist/index.html; then zip -qr pdf-release-evidence/compiled-frontend.zip dist; fi
          zip -q pdf-release-evidence/pdf-release-source.zip src/lib/ripleyPdfImport.ts src/lib/ripleyPdfLayout.ts src/lib/detailedMigration.ts src/pages/DetailedMigration.tsx src/components/RipleyPdfGuide.tsx package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripley-pdf-build-evidence
          path: pdf-release-evidence
          retention-days: 5

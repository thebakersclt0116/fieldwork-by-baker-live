name: Baker AI production smoke

on:
  push:
    branches:
      - baker-ai-beta
    paths:
      - .github/workflows/runtime-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production Baker AI runtime
        shell: bash
        run: |
          set -u
          BASE="https://fieldwork-by-baker-testing.vercel.app"
          for PATHNAME in /api/health /api/baker-ai; do
            echo "===== $PATHNAME ====="
            curl --silent --show-error --include "$BASE$PATHNAME" || true
            echo
          done

name: Production Import Smoke

on:
  push:
    branches: [smart-import]
    paths:
      - '.github/workflows/import-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose production import API
        run: |
          set +e
          BASE='https://fieldwork-by-baker-testing.vercel.app'
          echo '=== IMPORT GET ==='
          curl -sS -i --connect-timeout 10 --max-time 20 "$BASE/api/import-fieldwork"
          echo
          echo '=== IMPORT POST WITHOUT AUTH ==='
          curl -sS -i --connect-timeout 10 --max-time 20 -X POST "$BASE/api/import-fieldwork" -H 'Content-Type: application/json' --data '{"rawText":"sample"}'
          echo
          exit 0
